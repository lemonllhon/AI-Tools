name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  # PUBLIC_RELEASE_REPOSITORY can be configured as a repository variable
  # or as a secret. Format: owner/repo
  PUBLIC_RELEASE_REPOSITORY: ${{ vars.PUBLIC_RELEASE_REPOSITORY || secrets.PUBLIC_RELEASE_REPOSITORY }}

jobs:
  prepare-public-release:
    name: Prepare public release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      public_release_repository: ${{ steps.public_repo.outputs.full_name }}
      public_owner: ${{ steps.public_repo.outputs.owner }}
      public_repo_name: ${{ steps.public_repo.outputs.repo }}
      public_release_branch: ${{ steps.public_tag.outputs.branch }}
    steps:
      - name: Validate public release config
        id: public_repo
        env:
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_RELEASE_REPOSITORY:-}" ]; then
            echo "::error::Missing PUBLIC_RELEASE_REPOSITORY. Configure it as a repository variable or secret, for example owner/repo."
            exit 1
          fi
          if [ -z "${PUBLIC_RELEASE_TOKEN:-}" ]; then
            echo "::error::Missing PUBLIC_RELEASE_TOKEN secret. The token needs contents:write permission on ${PUBLIC_RELEASE_REPOSITORY}."
            exit 1
          fi
          if [[ "${PUBLIC_RELEASE_REPOSITORY}" != */* ]]; then
            echo "::error::PUBLIC_RELEASE_REPOSITORY must use owner/repo format. Current value: ${PUBLIC_RELEASE_REPOSITORY}"
            exit 1
          fi
          owner="${PUBLIC_RELEASE_REPOSITORY%%/*}"
          repo="${PUBLIC_RELEASE_REPOSITORY#*/}"
          if [ -z "$owner" ] || [ -z "$repo" ]; then
            echo "::error::PUBLIC_RELEASE_REPOSITORY must use owner/repo format."
            exit 1
          fi
          echo "full_name=${PUBLIC_RELEASE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"

      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -e "console.log(require(require('path').join(process.env.GITHUB_WORKSPACE, 'package.json')).version)")"
          EXPECTED_TAG="v${VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]] && [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag (${GITHUB_REF_NAME}) does not match package.json version (${EXPECTED_TAG})."
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${EXPECTED_TAG}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build bilingual release notes from changelog
        shell: bash
        run: |
          set -euo pipefail

          extract_section() {
            local file="$1"
            local version="$2"

            awk -v version="$version" '
              BEGIN {
                capture = 0
                found = 0
              }

              /^## / {
                if (capture) {
                  exit
                }
                if ($0 ~ ("^## \\[" version "\\][[:space:]]*-.*$") || $0 ~ ("^## \\[v" version "\\][[:space:]]*-.*$")) {
                  capture = 1
                  found = 1
                }
              }

              capture {
                if ($0 ~ /^---[[:space:]]*$/) {
                  exit
                }
                print
              }

              END {
                if (!found) {
                  exit 2
                }
              }
            ' "$file"
          }

          if ! zh_section="$(extract_section CHANGELOG.zh-CN.md "$VERSION")"; then
            echo "Missing changelog section for version $VERSION in CHANGELOG.zh-CN.md"
            exit 1
          fi

          if ! en_section="$(extract_section CHANGELOG.md "$VERSION")"; then
            echo "Missing changelog section for version $VERSION in CHANGELOG.md"
            exit 1
          fi

          {
            echo "## 更新日志（中文）"
            echo
            printf '%s\n' "$zh_section"
            echo
            echo "## Changelog (English)"
            echo
            printf '%s\n' "$en_section"
          } > release-notes.md

      - name: Prepare public release repository
        env:
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_WORKSPACE}/public-release-repo"
          rm -rf "$repo"
          mkdir -p "$repo"
          cd "$repo"

          git init
          git remote add origin "https://x-access-token:${PUBLIC_RELEASE_TOKEN}@github.com/${PUBLIC_RELEASE_REPOSITORY}.git"

          branch="$(git ls-remote --symref origin HEAD 2>/dev/null | awk '/^ref:/ { sub("refs/heads/", "", $2); print $2; exit }')"
          if [ -z "$branch" ]; then
            branch="main"
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout --orphan "$branch"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          echo "PUBLIC_RELEASE_BRANCH=${branch}" >> "$GITHUB_ENV"

      - name: Create public release tag commit
        id: public_tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_WORKSPACE}/public-release-repo"
          cd "$repo"

          branch="${PUBLIC_RELEASE_BRANCH:-main}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          source_commit_message="$(git -C "$GITHUB_WORKSPACE" log -1 --format=%B | sed '/^[[:space:]]*$/d' | head -n 1)"
          if [ -z "${source_commit_message}" ]; then
            source_commit_message="Release ${RELEASE_TAG}"
          fi

          message_file="${RUNNER_TEMP}/public-release-commit-message.txt"
          printf '%s\n' "${source_commit_message}" > "$message_file"
          git commit --allow-empty --file "$message_file"

          git tag -f "${RELEASE_TAG}"
          git push origin "HEAD:${branch}"
          git push origin "refs/tags/${RELEASE_TAG}" --force
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Create or update public draft release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          title="AI Lemon Tools v${VERSION}"
          if gh release view "${RELEASE_TAG}" --repo "${PUBLIC_RELEASE_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${PUBLIC_RELEASE_REPOSITORY}" \
              --title "${title}" \
              --notes-file release-notes.md \
              --draft=true \
              --prerelease=false
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${PUBLIC_RELEASE_REPOSITORY}" \
              --title "${title}" \
              --notes-file release-notes.md \
              --draft
          fi

  release:
    needs: prepare-public-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          # macOS Intel
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          # macOS Universal (同时支持 Intel 和 Apple Silicon)
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          # Linux x86_64
          - platform: "ubuntu-22.04"
            args: ""
          # Linux ARM64
          - platform: "ubuntu-24.04-arm"
            args: ""
          # Windows x86_64
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev
          sudo apt-get install -y libnm-dev xdg-utils

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install

      - name: Sync versions
        run: npm run sync-version

      - name: Point updater endpoint to public release repository
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const repo = process.env.PUBLIC_RELEASE_REPOSITORY;
          if (!repo || !repo.includes('/')) {
            throw new Error('PUBLIC_RELEASE_REPOSITORY must use owner/repo format.');
          }

          const configPath = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          config.plugins ??= {};
          config.plugins.updater ??= {};
          config.plugins.updater.endpoints = [
            `https://github.com/${repo}/releases/latest/download/latest.json`,
          ];
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          console.log(`Updater endpoint: ${config.plugins.updater.endpoints[0]}`);
          NODE

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          VERSION="$(node -e "console.log(require(require('path').join(process.env.GITHUB_WORKSPACE, 'package.json')).version)")"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          EXPECTED_TAG="v${{ steps.app_version.outputs.VERSION }}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag (${GITHUB_REF_NAME}) does not match package.json version (${EXPECTED_TAG})."
            exit 1
          fi

      - name: Build bilingual release notes from changelog
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.app_version.outputs.VERSION }}"

          extract_section() {
            local file="$1"
            local version="$2"

            awk -v version="$version" '
              BEGIN {
                capture = 0
                found = 0
              }

              /^## / {
                if (capture) {
                  exit
                }
                if ($0 ~ ("^## \\[" version "\\][[:space:]]*-.*$") || $0 ~ ("^## \\[v" version "\\][[:space:]]*-.*$")) {
                  capture = 1
                  found = 1
                }
              }

              capture {
                if ($0 ~ /^---[[:space:]]*$/) {
                  exit
                }
                print
              }

              END {
                if (!found) {
                  exit 2
                }
              }
            ' "$file"
          }

          if ! zh_section="$(extract_section CHANGELOG.zh-CN.md "$VERSION")"; then
            echo "Missing changelog section for version $VERSION in CHANGELOG.zh-CN.md"
            exit 1
          fi

          if ! en_section="$(extract_section CHANGELOG.md "$VERSION")"; then
            echo "Missing changelog section for version $VERSION in CHANGELOG.md"
            exit 1
          fi

          {
            echo "body<<EOF"
            echo "## 更新日志（中文）"
            echo
            printf '%s\n' "$zh_section"
            echo
            echo "## Changelog (English)"
            echo
            printf '%s\n' "$en_section"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: ${{ needs.prepare-public-release.outputs.public_owner }}
          repo: ${{ needs.prepare-public-release.outputs.public_repo_name }}
          releaseCommitish: ${{ needs.prepare-public-release.outputs.public_release_branch }}
          tagName: ${{ needs.prepare-public-release.outputs.release_tag }}
          releaseName: "AI Lemon Tools v${{ steps.app_version.outputs.VERSION }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Package Windows portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.app_version.outputs.VERSION }}
        run: |
          $ErrorActionPreference = "Stop"

          $targetRoots = @(
            (Join-Path $env:GITHUB_WORKSPACE "target"),
            (Join-Path $env:GITHUB_WORKSPACE "src-tauri/target")
          ) | Where-Object { Test-Path -LiteralPath $_ }

          if ($targetRoots.Count -eq 0) {
            throw "No Cargo target directory found under workspace: $env:GITHUB_WORKSPACE"
          }

          Write-Host "Searching Windows executable under:"
          $targetRoots | ForEach-Object { Write-Host "  $_" }

          $exe = Get-ChildItem -Path $targetRoots -Filter "*.exe" -File -Recurse |
            Where-Object {
              $_.FullName -notmatch "\\bundle\\" -and
              $_.FullName -notmatch "\\deps\\" -and
              $_.FullName -notmatch "\\build\\" -and
              $_.Name -notmatch "(?i)(setup|installer|unins)"
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "Known target directories:"
            Get-ChildItem -Path $targetRoots -Directory -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 80 -ExpandProperty FullName |
              ForEach-Object { Write-Host "  $_" }
            throw "No Windows executable found in Cargo target directories."
          }

          $releaseDir = $exe.Directory.FullName
          Write-Host "Portable source executable: $($exe.FullName)"
          Write-Host "Portable source directory: $releaseDir"

          $portableRoot = Join-Path $env:RUNNER_TEMP "ai-lemon-tools-portable"
          $appDir = Join-Path $portableRoot "AI Lemon Tools"
          Remove-Item -LiteralPath $portableRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null

          Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $appDir "AI Lemon Tools.exe") -Force

          $sidecarExtensions = @(".dll", ".dat", ".pak", ".bin")
          Get-ChildItem -Path $releaseDir -File |
            Where-Object { $sidecarExtensions -contains $_.Extension.ToLowerInvariant() } |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination $appDir -Force
            }

          $resourceDir = Join-Path $releaseDir "resources"
          if (Test-Path -LiteralPath $resourceDir) {
            Copy-Item -LiteralPath $resourceDir -Destination (Join-Path $appDir "resources") -Recurse -Force
          }

          @"
          AI Lemon Tools Windows Portable

          中文：
          - 解压后直接运行 AI Lemon Tools.exe，无需安装。
          - 如果系统提示缺少 WebView2 Runtime，请先安装 Microsoft Edge WebView2 Runtime。
          - 免安装包不会写入 Windows 安装列表；应用数据仍按软件内配置的数据目录保存。

          English:
          - Unzip and run AI Lemon Tools.exe. No installer is required.
          - Install Microsoft Edge WebView2 Runtime first if Windows reports that WebView2 is missing.
          - The portable package is not registered in Windows installed apps; app data still follows the data directory configured in the app.
          "@ | Set-Content -Path (Join-Path $appDir "README-portable.txt") -Encoding UTF8

          $zip = Join-Path $env:GITHUB_WORKSPACE "AI Lemon Tools_$($env:APP_VERSION)_windows_x64_portable.zip"
          Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $appDir -DestinationPath $zip -Force

          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8

      - name: Upload Windows portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          APP_VERSION: ${{ steps.app_version.outputs.VERSION }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release upload "v$env:APP_VERSION" "$env:PORTABLE_ZIP" --repo "$env:PUBLIC_RELEASE_REPOSITORY" --clobber

  rebuild-latest-json:
    name: Rebuild merged latest.json
    needs:
      - prepare-public-release
      - release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine version
        shell: bash
        run: |
          VERSION="${{ needs.prepare-public-release.outputs.version }}"
          RELEASE_TAG="${{ needs.prepare-public-release.outputs.release_tag }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Download release assets (retry)
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          downloaded="false"
          for i in $(seq 1 30); do
            if gh release download "$RELEASE_TAG" --repo "${PUBLIC_RELEASE_REPOSITORY}" --dir release-assets --pattern "*" --clobber; then
              downloaded="true"
              echo "Downloaded release assets from $RELEASE_TAG"
              break
            fi
            echo "Release assets not ready yet (attempt $i/30). Sleeping 10s..."
            sleep 10
          done
          if [ "$downloaded" != "true" ]; then
            echo "Failed to download release assets from $RELEASE_TAG after retries."
            exit 1
          fi

      - name: Read release metadata
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "${PUBLIC_RELEASE_REPOSITORY}" --json body --jq '.body' > release-notes.md
          PUBLISHED_AT="$(gh release view "$RELEASE_TAG" --repo "${PUBLIC_RELEASE_REPOSITORY}" --json publishedAt,createdAt --jq '.publishedAt // .createdAt')"
          if [ -z "${PUBLISHED_AT}" ] || [ "${PUBLISHED_AT}" = "null" ]; then
            PUBLISHED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          fi
          echo "PUBLISHED_AT=${PUBLISHED_AT}" >> "$GITHUB_ENV"

      - name: Build merged latest.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/build_merged_latest_json.cjs \
            --version "${VERSION}" \
            --repo "${PUBLIC_RELEASE_REPOSITORY}" \
            --assets-dir "release-assets" \
            --notes-file "release-notes.md" \
            --published-at "${PUBLISHED_AT}" \
            --output "latest.json"

      - name: Validate merged latest.json
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .platforms["darwin-aarch64"] and
            .platforms["darwin-x86_64"] and
            .platforms["windows-x86_64"] and
            .platforms["windows-x86_64-nsis"] and
            .platforms["linux-x86_64-appimage"] and
            .platforms["linux-x86_64-deb"] and
            .platforms["linux-x86_64-rpm"] and
            .platforms["linux-aarch64-appimage"] and
            .platforms["linux-aarch64-deb"] and
            .platforms["linux-aarch64-rpm"]
          ' latest.json > /dev/null
          jq -r '.platforms | keys[]' latest.json

      - name: Upload merged latest.json
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" latest.json --repo "${PUBLIC_RELEASE_REPOSITORY}" --clobber

  upload-checksums:
    name: Upload SHA256SUMS
    needs:
      - prepare-public-release
      - release
      - rebuild-latest-json
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Determine version
        shell: bash
        run: |
          VERSION="${{ needs.prepare-public-release.outputs.version }}"
          RELEASE_TAG="${{ needs.prepare-public-release.outputs.release_tag }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Download release assets (retry)
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          downloaded="false"
          for i in $(seq 1 30); do
            if gh release download "$RELEASE_TAG" --repo "${PUBLIC_RELEASE_REPOSITORY}" --dir release-assets --pattern "*" --clobber; then
              downloaded="true"
              echo "Downloaded release assets from $RELEASE_TAG"
              break
            fi
            echo "Release assets not ready yet (attempt $i/30). Sleeping 10s..."
            sleep 10
          done
          if [ "$downloaded" != "true" ]; then
            echo "Failed to download release assets from $RELEASE_TAG after retries."
            exit 1
          fi

      - name: Generate SHA256SUMS.txt from release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA256SUMS.txt
          find . -type f -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                shasum -a 256 "$file"
              done \
            | sed 's#  \./#  #' \
            > ../SHA256SUMS.txt
          cd ..
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt to release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --repo "${PUBLIC_RELEASE_REPOSITORY}" --clobber

  update-homebrew-cask:
    name: Update Homebrew Cask
    needs:
      - prepare-public-release
      - publish-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Update the cask on main, not on the tag ref.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine version
        shell: bash
        run: |
          VERSION="${{ needs.prepare-public-release.outputs.version }}"
          RELEASE_TAG="${{ needs.prepare-public-release.outputs.release_tag }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Download universal DMG from GitHub Releases (retry)
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cask-asset
          for i in $(seq 1 30); do
            rm -f cask-asset/*
            if gh release download "$RELEASE_TAG" \
              --repo "${PUBLIC_RELEASE_REPOSITORY}" \
              --pattern "*_universal.dmg" \
              --dir cask-asset \
              --clobber; then
              DMG_PATH="$(find cask-asset -maxdepth 1 -type f -name '*_universal.dmg' | sort | head -n 1)"
              if [ -n "$DMG_PATH" ] && [ -f "$DMG_PATH" ]; then
                mv "$DMG_PATH" ai-lemon-tools.dmg
                DMG_ASSET_NAME="$(basename "$DMG_PATH")"
                echo "DMG_ASSET_NAME=${DMG_ASSET_NAME}" >> "$GITHUB_ENV"
                echo "Downloaded universal DMG asset: ${DMG_ASSET_NAME}"
                exit 0
              fi
            fi
            echo "Asset not ready yet (attempt $i/30). Sleeping 10s..."
            sleep 10
          done
          echo "Failed to download release asset after retries."
          exit 1

      - name: Compute sha256
        shell: bash
        run: |
          set -euo pipefail
          SHA256="$(sha256sum ai-lemon-tools.dmg | awk '{print $1}')"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          CASK_URL="$(node <<'NODE'
          const assetName = process.env.DMG_ASSET_NAME;
          const version = process.env.VERSION;
          const repo = process.env.PUBLIC_RELEASE_REPOSITORY;

          if (!assetName || !version || !repo) {
            throw new Error('Missing DMG_ASSET_NAME, VERSION, or PUBLIC_RELEASE_REPOSITORY');
          }

          const encodedAssetName = encodeURIComponent(assetName);
          const encodedVersion = encodeURIComponent(version);
          const assetTemplate = encodedAssetName.split(encodedVersion).join('#{version}');
          console.log(`https://github.com/${repo}/releases/download/v#{version}/${assetTemplate}`);
          NODE
          )"
          echo "CASK_URL=$CASK_URL" >> "$GITHUB_ENV"

      - name: Update Cask file
        shell: bash
        run: |
          set -euo pipefail
          FILE="Casks/cockpit-tools.rb"
          if [ ! -f "$FILE" ]; then
            echo "Missing $FILE. Create it first."
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');

          const file = 'Casks/cockpit-tools.rb';
          const version = process.env.VERSION;
          const sha256 = process.env.SHA256;
          const caskUrl = process.env.CASK_URL;
          const repo = process.env.PUBLIC_RELEASE_REPOSITORY;

          if (!version || !sha256 || !caskUrl || !repo) {
            throw new Error('Missing VERSION, SHA256, CASK_URL, or PUBLIC_RELEASE_REPOSITORY');
          }

          let text = fs.readFileSync(file, 'utf8');
          text = text.replace(/version "[^"]+"/, `version "${version}"`);
          text = text.replace(/sha256 "[0-9a-f]{64}"/, `sha256 "${sha256}"`);
          text = text.replace(
            /url "[^"]+",\n\s+verified: "[^"]+"/,
            `url "${caskUrl}",\n      verified: "https://github.com/${repo}/"`
          );
          fs.writeFileSync(file, text);
          NODE

          git diff -- "$FILE"

      - name: Create pull request
        id: create_cask_pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(homebrew): update cask for v${{ env.VERSION }}"
          title: "chore(homebrew): update cask for v${{ env.VERSION }}"
          body: |
            Auto-generated by the release workflow.

            - version: ${{ env.VERSION }}
            - sha256 (universal.dmg): ${{ env.SHA256 }}
          branch: "automation/update-cask-v${{ env.VERSION }}"
          base: main
          delete-branch: true

      - name: Enable auto-merge for cask PR
        if: ${{ steps.create_cask_pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.create_cask_pr.outputs.pull-request-number }}"
          PR_BRANCH="$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)"
          if [[ "$PR_BRANCH" != automation/update-cask-v* ]]; then
            echo "Unexpected PR branch: $PR_BRANCH"
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

  publish-release:
    name: Publish release as latest
    needs:
      - prepare-public-release
      - release
      - rebuild-latest-json
      - upload-checksums
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Determine version
        shell: bash
        run: |
          VERSION="${{ needs.prepare-public-release.outputs.version }}"
          RELEASE_TAG="${{ needs.prepare-public-release.outputs.release_tag }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "${PUBLIC_RELEASE_REPOSITORY}" --draft=false --prerelease=false --latest
